<!DOCTYPE html>
<html lang="bn">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>লগইন - কুইজ পোর্টাল</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <!-- Navigation Bar -->

    <header class="navbar">

        <div class="container nav-content">

            <a href="index.html" class="logo">
                কুইজ পোর্টাল
            </a>

            <nav>
                <a href="index.html">হোম</a>
                <a href="login.html">লগইন</a>
                <a href="register.html">নিবন্ধন</a>
            </nav>

        </div>

    </header>


    <!-- Login Section -->

    <main class="auth-section">

        <div class="auth-container">

            <div class="auth-header">
                <h1>স্বাগতম</h1>
                <p>আপনার অ্যাকাউন্টে প্রবেশ করুন</p>
            </div>

            <div id="errorBox" class="error-box" style="display:none;"></div>

            <form class="auth-form" id="loginForm">

                <div class="form-group">
                    <label for="email">ইমেইল</label>
                    <input type="email" id="email" name="email"
                           placeholder="আপনার ইমেইল লিখুন" required>
                </div>

                <div class="form-group">
                    <label for="password">পাসওয়ার্ড</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password"
                               placeholder="আপনার পাসওয়ার্ড লিখুন" required>
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="পাসওয়ার্ড দেখুন">
                            <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 style="display:none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox"> আমাকে মনে রাখুন
                    </label>
                    <a href="#">পাসওয়ার্ড ভুলে গেছেন?</a>
                </div>

                <button type="submit" class="auth-btn" id="loginBtn">
                    প্রবেশ করুন
                </button>

            </form>

            <div class="auth-footer">
                <p>
                    অ্যাকাউন্ট নেই?
                    <a href="register.html">নিবন্ধন করুন</a>
                </p>
            </div>

        </div>

    </main>


    <footer class="footer">
        <div class="container">
            <p>© ২০২৬ কুইজ পোর্টাল। সর্বস্বত্ব সংরক্ষিত।</p>
        </div>
    </footer>


    <!-- JavaScript for API connection -->

    <script>
        const API_BASE = "http://localhost:8080";

        const loginForm = document.getElementById("loginForm");
        const errorBox = document.getElementById("errorBox");
        const loginBtn = document.getElementById("loginBtn");

        // ==============================
        // পাসওয়ার্ড দেখানো / লুকানো
        // ==============================
        const passwordInput = document.getElementById("password");
        const toggleBtn = document.getElementById("togglePassword");
        const eyeOpen = document.getElementById("eyeOpen");
        const eyeClosed = document.getElementById("eyeClosed");

        toggleBtn.addEventListener("click", function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeOpen.style.display = "none";
                eyeClosed.style.display = "block";
                toggleBtn.setAttribute("aria-label", "পাসওয়ার্ড লুকান");
            } else {
                passwordInput.type = "password";
                eyeOpen.style.display = "block";
                eyeClosed.style.display = "none";
                toggleBtn.setAttribute("aria-label", "পাসওয়ার্ড দেখুন");
            }
            passwordInput.focus();
        });


        // ==============================
        // Login Submit
        // ==============================
        loginForm.addEventListener("submit", async function (e) {

            e.preventDefault();

            errorBox.style.display = "none";
            loginBtn.textContent = "অপেক্ষা করুন...";
            loginBtn.disabled = true;

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                showError("ইমেইল ও পাসওয়ার্ড দুটোই দিতে হবে");
                resetBtn();
                return;
            }

            try {

                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {

                    localStorage.setItem("user", JSON.stringify(data.data));

                    // 🔥 Redirect parameter চেক করো
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectUrl = urlParams.get("redirect");

                    if (redirectUrl) {
                        // আগের পেজে ফিরে যাও
                        window.location.href = redirectUrl;
                    } else if (data.data.role === "ADMIN") {
                        window.location.href = "admin/dashboard.html";
                    } else {
                        window.location.href = "user/dashboard.html";
                    }

                } else {
                    showError(data.message || "প্রবেশ ব্যর্থ হয়েছে");
                    resetBtn();
                }

            } catch (error) {
                console.error("Error:", error);
                showError("সার্ভারে সংযোগ করা যাচ্ছে না। আবার চেষ্টা করুন।");
                resetBtn();
            }
        });


        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = "block";
        }

        function resetBtn() {
            loginBtn.textContent = "প্রবেশ করুন";
            loginBtn.disabled = false;
        }
    </script>

</body>

</html>
