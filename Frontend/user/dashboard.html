<!DOCTYPE html>
<html lang="bn">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ড্যাশবোর্ড - ইউজার প্যানেল</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <!-- নেভিগেশন বার -->
    <header class="navbar">
        <div class="container nav-content">
            <a href="dashboard.html" class="logo">কুইজ পোর্টাল</a>

            <nav>
                <a href="dashboard.html" class="active">ড্যাশবোর্ড</a>
                <a href="quizzes.html">কুইজ</a>
                <a href="history.html">ইতিহাস</a>
                <a href="#" id="logoutBtn">Logout</a>
            </nav>
        </div>
    </header>


    <!-- মূল কনটেন্ট -->
    <main class="dashboard-page">

        <div class="container">

            <!-- স্বাগতম কার্ড -->
            <div class="welcome-card">
                <div>
                    <p class="welcome-label">ইউজার প্যানেল</p>
                    <h1 id="welcomeText">স্বাগতম</h1>
                    <p class="welcome-sub">
                        আপনার কুইজ সংক্রান্ত সব তথ্য এক নজরে দেখুন।
                    </p>
                </div>
                <div class="welcome-icon">🎯</div>
            </div>


            <!-- পরিসংখ্যান কার্ড -->
            <div class="stats-grid">

                <div class="stat-card">
                    <div class="stat-icon bg-blue">📚</div>
                    <div class="stat-info">
                        <span class="stat-number" id="quizCount">--</span>
                        <span class="stat-label">মোট কুইজ</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon bg-green">✅</div>
                    <div class="stat-info">
                        <span class="stat-number" id="attemptCount">--</span>
                        <span class="stat-label">কুইজ দিয়েছেন</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon bg-purple">🏆</div>
                    <div class="stat-info">
                        <span class="stat-number" id="passedCount">--</span>
                        <span class="stat-label">উত্তীর্ণ হয়েছেন</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon bg-orange">📊</div>
                    <div class="stat-info">
                        <span class="stat-number" id="avgScore">--</span>
                        <span class="stat-label">গড় স্কোর</span>
                    </div>
                </div>

            </div>


            <!-- দ্রুত কাজ -->
            <div class="section-block">
                <h2 class="section-title">দ্রুত কাজ</h2>

                <div class="quick-actions">

                    <a href="join.html" class="quick-btn">
        <span class="quick-icon">🎯</span>
        <span>কোড দিয়ে কুইজে যোগ দিন</span>
    </a>

                    <a href="quizzes.html" class="quick-btn">
                        <span class="quick-icon">📝</span>
                        <span>কুইজ শুরু করুন</span>
                    </a>

                    <a href="history.html" class="quick-btn">
                        <span class="quick-icon">📊</span>
                        <span>আমার ইতিহাস</span>
                    </a>

                </div>
            </div>

        </div>

    </main>


    <!-- ফুটার -->
    <footer class="footer">
        <div class="container">
            <p>© ২০২৬ কুইজ পোর্টাল। সর্বস্বত্ব সংরক্ষিত।</p>
        </div>
    </footer>


    <script src="js/dashboard.js"></script>

</body>
</html>
