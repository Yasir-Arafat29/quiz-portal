<!DOCTYPE html>
<html lang="bn">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বিভাগ - অ্যাডমিন প্যানেল</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/categories.css">
</head>

<body>

    <!-- নেভিগেশন বার -->
    <header class="navbar">
        <div class="container nav-content">
            <a href="dashboard.html" class="logo">কুইজ পোর্টাল</a>

            <nav>
                <a href="dashboard.html">ড্যাশবোর্ড</a>
                <a href="categories.html" class="active">বিভাগ</a>
                <a href="quizzes.html">কুইজ</a>
                <a href="questions.html">প্রশ্ন</a>
                <a href="users.html">ব্যবহারকারী</a>
                <a href="history.html">ইতিহাস</a>
                <a href="#" id="logoutBtn">লগআউট</a>
            </nav>
        </div>
    </header>


    <!-- মূল কনটেন্ট -->
    <main class="categories-page">

        <div class="container">

            <!-- পেজ হেডার -->
            <div class="page-header">
                <div>
                    <p class="page-label">অ্যাডমিন প্যানেল</p>
                    <h1>বিভাগ</h1>
                    <p>কুইজের বিভাগ তৈরি ও পরিচালনা করুন।</p>
                </div>

                <button class="add-btn" id="openFormBtn">
                    + নতুন বিভাগ
                </button>
            </div>


            <!-- বার্তা দেখানোর জায়গা -->
            <div id="messageBox" class="message-box" style="display:none;"></div>


            <!-- নতুন বিভাগ যোগ করার ফর্ম (modal এর মতো) -->
            <div class="form-card" id="formCard" style="display:none;">
                <h2 id="formTitle">নতুন বিভাগ যোগ করুন</h2>

                <form id="categoryForm">

                    <input type="hidden" id="editingId" value="">

                    <div class="form-group">
                        <label for="categoryName">বিভাগের নাম <span class="required">*</span></label>
                        <input type="text"
                               id="categoryName"
                               placeholder="যেমন: প্রোগ্রামিং"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="categoryDescription">বিবরণ</label>
                        <textarea id="categoryDescription"
                                  rows="3"
                                  placeholder="সংক্ষিপ্ত বিবরণ লিখুন"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="cancel-btn" id="cancelBtn">
                            বাতিল
                        </button>
                        <button type="submit" class="save-btn" id="saveBtn">
                            সংরক্ষণ করুন
                        </button>
                    </div>

                </form>
            </div>


            <!-- বিভাগের তালিকা -->
            <div class="list-card">

                <div class="list-header">
                    <h2>সব বিভাগ</h2>
                    <span id="countText">লোড হচ্ছে...</span>
                </div>


                <!-- টেবিল -->
                <div class="table-wrapper">

                    <table>
                        <thead>
                            <tr>
                                <th style="width: 60px;">ক্রম</th>
                                <th>বিভাগের নাম</th>
                                <th>বিবরণ</th>
                                <th style="width: 160px;">কার্যক্রম</th>
                            </tr>
                        </thead>

                        <tbody id="categoryTableBody">
                            <!-- JavaScript দিয়ে ডেটা আসবে -->
                        </tbody>
                    </table>

                    <!-- লোডিং স্পিনার -->
                    <div id="loadingBox" class="loading-box">
                        <div class="spinner"></div>
                        <p>লোড হচ্ছে...</p>
                    </div>

                    <!-- খালি অবস্থা -->
                    <div id="emptyBox" class="empty-box" style="display:none;">
                        <div class="empty-icon">📭</div>
                        <p>এখনো কোনো বিভাগ যোগ করা হয়নি।</p>
                        <button class="add-btn-small" onclick="document.getElementById('openFormBtn').click()">
                            প্রথম বিভাগ যোগ করুন
                        </button>
                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- ফুটার -->
    <footer class="footer">
        <div class="container">
            <p>© ২০২৬ কুইজ পোর্টাল। সর্বস্বত্ব সংরক্ষিত।</p>
        </div>
    </footer>


    <!-- JavaScript -->
    <script src="js/categories.js"></script>

</body>
</html>
